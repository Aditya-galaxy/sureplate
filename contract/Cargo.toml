[package]
name = "sureplate"
description = "Device passport NFT that escrows the maker's security-update bond"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Aditya-galaxy/sureplate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
near-contract-standards = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
